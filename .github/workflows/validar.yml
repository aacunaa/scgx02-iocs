name: validar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Datos válidos y archivos generados al día
        run: python3 scripts/construir.py --comprobar
      - name: Instalar yara-python (compila y prueba las reglas)
        run: python3 -m pip install --user --no-cache-dir yara-python==4.5.4
      - name: Pruebas
        run: python3 -m unittest discover -s tests -v
